<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quintzee local review</title><style>body{font:18px system-ui;background:#101b35;color:#eff7ff;max-width:520px;margin:8vh auto;padding:24px}button{display:block;width:100%;padding:18px;margin:14px 0;font:700 18px system-ui;border-radius:12px;border:1px solid #ffe16a;background:#ffe16a;color:#17213e}p{line-height:1.5}</style></head><body><h1>Quintzee local review</h1><p>Choose a fresh game. This preview uses disposable local fixtures. Production is unchanged.</p><button data-theme="modern" data-solo="true">Modern · Arcade</button><button data-theme="classic" data-solo="true">Classic · Arcade</button><button data-theme="modern" data-solo="false">Modern · fake multiplayer</button><button data-theme="classic" data-solo="false">Classic · fake multiplayer</button><p id="status"></p><script type="module">document.querySelectorAll('button').forEach(b=>b.onclick=async()=>{document.querySelectorAll('button').forEach(x=>x.disabled=true);try{const r=await fetch('/__quintzee/new',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({solo:b.dataset.solo==='true',theme:b.dataset.theme})});if(!r.ok)throw Error(await r.text());location.href='/dev/quintzee/production.html?'+new URLSearchParams(await r.json());}catch(e){document.querySelector('#status').textContent=e.message;document.querySelectorAll('button').forEach(x=>x.disabled=false);}});</script></body></html>
