<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ptown Words · local polish preview</title>
<style>body{margin:0;background:#101a28;color:#f2eee0;font:18px system-ui;display:grid;place-content:center;min-height:100svh;padding:24px;box-sizing:border-box}main{max-width:460px}h1{font-size:28px}button{font:inherit;background:#7be1cc;border:0;border-radius:8px;padding:16px 24px;color:#102831;cursor:pointer}small{color:#aebfcd}p{line-height:1.5}</style>
<main><small>LOCAL PREVIEW · synthetic fake-money game</small><h1>Ptown Words polish</h1><p>Double-tap a zoomed board to zoom out. Stage a word to see the compact action row. Play or pass to watch your opponent’s reveal.</p><button id="start">Start a fresh preview</button><p id="status" role="status"></p><small>Nothing here publishes or changes a production session.</small></main>
<script type="module">
const post=async(op,body={},token='')=>(await fetch('/__ptown_words_route/'+op,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(body)})).json();
document.querySelector('#start').onclick=async()=>{const button=document.querySelector('#start'),status=document.querySelector('#status');button.disabled=true;try{status.textContent='Creating your local table…';const f=await post('new',{bot:true});const g=await post('rpc',{name:'read_session_frame',args:{p_game_id:f.game}},f.tokens[0]);const cfg=await post('rpc',{name:'ptown_words_configure',args:{p_game_id:f.game,p_dealer_player_id:f.players[0],p_expected_dealer_position:2,p_game_type:'ptown-words',p_config:{ante_amount:5},p_expected_config_deadline:g.data.game.config_deadline}},f.tokens[0]);if(cfg.error)throw Error(cfg.error.message);const begun=await post('rpc',{name:'advance_ante_phase',args:{p_game_id:f.game,p_expected_dealer_game_id:cfg.data.dealer_game.id}},f.tokens[0]);if(begun.error)throw Error(begun.error.message);location.href='/game/'+f.game+'?token='+f.tokens[0];}catch(e){status.textContent=e.message;button.disabled=false;}};
</script></html>
