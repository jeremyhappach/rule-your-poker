 function layout(){if(!zoom){const area=q('.pt-board-area'),avail=area.clientHeight-q('.pt-board-tools').offsetHeight-q('.pt-board-bottom').offsetHeight;viewport.style.flex='none';viewport.style.width=Math.max(80,Math.min(area.clientWidth-(device==='phone'?20:14),avail,660))+'px';viewport.style.height=viewport.style.width;}else{viewport.style.flex='1';viewport.style.width='100%';viewport.style.height='auto';}location();}
 function render(){
  game.dataset.device=device;const compact=device==='phone'&&design.phoneSize==='320 × 568';game.dataset.compact=String(compact);game.style.width=device==='phone'?(compact?'320px':'390px'):'';game.style.height=device==='phone'?(compact?'568px':'760px'):'';viewport.dataset.zoom=zoom;q('.pt-overview-hit').hidden=zoom;q('.pt-zoomout').hidden=!zoom;q('.pt-inspect').hidden=!zoom;q('.pt-inspect').setAttribute('aria-pressed',String(selected===null));q('.pt-pan').hidden=!zoom;
  q('.pt-scores').innerHTML=[['You',committed?13:10,!opponent],['Mara',5,opponent],...(design.players==='4'?[['Eli',0,false],['Jo',0,false]]:[])].map(([name,score,active])=>`<div class="pt-score ${active?'active':''}"><span class="pt-dot"></span><span>${name}${active?'<br><small>playing</small>':''}</span><strong>${score}</strong></div>`).join('');
  board.innerHTML='';for(let r=0;r<15;r++)for(let c=0;c<15;c++){let key=r+','+c,s=staged.find(t=>t.r===r&&t.c===c),letter=base[key]||(committed&&c===7&&r===8?'R':committed&&c===7&&r===9?'T':null)||s?.letter;let el=document.createElement(zoom?'button':'span');el.className='pt-cell'+(letter?' tile':'')+(s?' staged':'')+(s?.blank?' blank':'');el.dataset.row=r;el.dataset.col=c;el.dataset.premium=premiums[key]||'';el.setAttribute('aria-label',`${String.fromCharCode(65+c)}${r+1}${letter?' '+letter+(s?.blank?' blank':''):' '+(premiums[key]||'empty')}${s?' staged, tap to return':''}`);el.innerHTML=letter?`<b>${letter}</b><small>${s?.blank?0:points[letter]}</small>`:r===7&&c===7?'<span class="pt-start">PT<small>START · DW</small></span>':premiums[key]||'';board.append(el);}
  q('.pt-rack').innerHTML=rack.map((l,i)=>`<button data-rack="${i}" class="${staged.some(t=>t.i===i)?'used ':''}${selected===i?'selected':''}" aria-label="${l==='?'?'Blank':l}, ${points[l]} points" aria-pressed="${selected===i}" ${staged.some(t=>t.i===i)?'disabled':''}>${l==='?'?'◇':l}<small>${points[l]}</small></button>`).join('');
  q('.pt-turn').textContent=opponent?'Mara’s turn':'Your turn';q('.pt-clock').textContent=opponent?'01:46':'02:18';q('.pt-bag').textContent=(100-(committed?7:5)-7*Number(design.players))+' in bag';q('.pt-rack-state').textContent=staged.length?staged.length+' staged':'7 tiles';q('.pt-last').textContent=committed?'You played ART · 3':'Mara played DOT · 5';
  q('.pt-feedback').textContent=message||(opponent?'Mara is thinking…':selected!==null?`${rack[selected]==='?'?'Blank':rack[selected]} selected`:staged.length?'Draft · not submitted':zoom?'Inspecting':'');
  q('.pt-edit').hidden=!staged.length;q('.pt-submit').hidden=!staged.length;q('.pt-submit').disabled=opponent;q('.pt-undo').disabled=!undo.length;q('.pt-pass').disabled=opponent;q('.pt-exchange').disabled=opponent;
  root.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scene===mode)));root.querySelectorAll('[data-device]').forEach(b=>{if(b.tagName==='BUTTON')b.setAttribute('aria-pressed',String(b.dataset.device===device));});
  requestAnimationFrame(layout);
 }
 function saveUndo(){undo.push(staged.map(t=>({...t})));}
 function close(){q('.pt-overlay').hidden=true;q('.pt-close').textContent='Cancel';}
 function dialog(html){q('.pt-dialog-content').innerHTML=html;q('.pt-overlay').hidden=false;q('.pt-dialog button')?.focus();}
 function stage(i,r,c,letter){saveUndo();staged.push({i,r,c,letter,blank:rack[i]==='?'});selected=null;message='';render();}
 function zoomAt(r=8,c=7){zoom=true;render();requestAnimationFrame(()=>{layout();viewport.scrollLeft=Math.max(0,c*49-viewport.clientWidth/2+24);viewport.scrollTop=Math.max(0,r*49-viewport.clientHeight/2+24);location();});}
 function scene(s){close();mode=s;message='';selected=null;undo=[];staged=[];committed=s==='opponent';opponent=committed;rack=committed?['E','L','N','S','?','A','I']:['R','T','E','L','N','S','?'];zoom=s==='zoom'||s==='staged';if(s==='staged'){staged=[{i:0,r:8,c:7,letter:'R'},{i:1,r:9,c:7,letter:'T'}];undo=[[],[staged[0]]];}render();if(zoom)zoomAt();}
 root.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>scene(b.dataset.scene));root.querySelectorAll('button[data-device]').forEach(b=>b.onclick=()=>{device=b.dataset.device;const short=device==='landscape';if(short&&root.clientWidth<650){device='phone';message='Expand this preview to review landscape at full size.';}q('.review-caption').textContent=device==='phone'?'390 × 760 portrait · overview navigates; placement opens at 48 px per square.':device==='landscape'?'844 × 390 landscape · board left; private rack and actions stay on the right.':'1024 × 760 desktop · full board overview; the same explicit placement mode.';render();if(zoom)zoomAt();});
 q('.pt-overview-hit').onclick=e=>{const b=e.currentTarget.getBoundingClientRect();selected=null;zoomAt(Math.min(14,Math.floor((e.clientY-b.top)/b.height*15)),Math.min(14,Math.floor((e.clientX-b.left)/b.width*15)));};
 q('.pt-zoomout').onclick=()=>{zoom=false;selected=null;message='';render();};q('.pt-inspect').onclick=()=>{selected=null;message='';render();};viewport.onscroll=location;
 root.querySelectorAll('[data-pan]').forEach(b=>b.onclick=()=>{selected=null;message='';const d=b.dataset.pan;viewport.scrollBy({left:d==='left'?-147:d==='right'?147:0,top:d==='up'?-147:d==='down'?147:0});render();});
 q('.pt-rack').onclick=e=>{const b=e.target.closest('[data-rack]');if(!b||b.disabled)return;if(opponent){message='Your rack · waiting for your turn';render();return;}const i=Number(b.dataset.rack);selected=selected===i?null:i;message='';if(!zoom){zoomAt();}else render();};
 let down=null;board.onpointerdown=e=>{down={x:e.clientX,y:e.clientY,left:viewport.scrollLeft,top:viewport.scrollTop};};board.onclick=e=>{if(!zoom||opponent)return;if(down&&(Math.hypot(e.clientX-down.x,e.clientY-down.y)>8||Math.abs(viewport.scrollLeft-down.left)>3||Math.abs(viewport.scrollTop-down.top)>3))return;const b=e.target.closest('[data-row]');if(!b)return;const r=Number(b.dataset.row),c=Number(b.dataset.col),existing=staged.findIndex(t=>t.r===r&&t.c===c);if(existing>=0){dialog('<h3>Staged '+staged[existing].letter+'</h3><button class="pt-confirm">Return to rack</button>');q('.pt-confirm').onclick=()=>{close();saveUndo();staged.splice(existing,1);selected=null;message='Tile returned';render();};return;}if(selected===null)return;if(base[r+','+c]){message='Square occupied';render();return;}const i=selected;if(rack[i]==='?'){dialog('<h3>Choose a letter</h3><div class="pt-letters">'+Array.from('ABCDEFGHIJKLMNOPQRSTUVWXYZ',l=>`<button data-letter="${l}">${l}</button>`).join('')+'</div>');q('.pt-letters').onclick=ev=>{const letter=ev.target.dataset.letter;if(letter){close();stage(i,r,c,letter);}};}else stage(i,r,c,rack[i]);};
 q('.pt-undo').onclick=()=>{staged=undo.pop()||[];selected=null;message='';render();};q('.pt-recall').onclick=()=>{saveUndo();staged=[];selected=null;message='Tiles returned';render();};
 q('.pt-submit').onclick=()=>{const art=staged.length===2&&staged.some(t=>t.r===8&&t.c===7&&t.letter==='R')&&staged.some(t=>t.r===9&&t.c===7&&t.letter==='T');if(art){scene('opponent');message='ART · 3 points';render();}else{message='Demo fixture: submit ART below the center A.';render();}};
 q('.pt-pass').onclick=()=>{dialog('<h3>Pass this turn?</h3><p>'+ (staged.length?'Your staged tiles return to your rack.':'You keep your tiles.')+'</p><button class="pt-confirm">Pass turn</button>');q('.pt-confirm').onclick=()=>{close();saveUndo();staged=[];selected=null;opponent=true;message='You passed';render();};};
 q('.pt-exchange').onclick=()=>{exchangeSet=new Set();dialog('<h3>Exchange tiles</h3><p>Select tiles to return. This uses your turn.</p><div class="pt-exchange-tiles">'+rack.map((l,i)=>`<button data-ex="${i}" aria-pressed="false">${l==='?'?'◇':l}</button>`).join('')+'</div><button class="pt-confirm" disabled>Exchange 0 tiles</button>');q('.pt-exchange-tiles').onclick=e=>{const b=e.target.closest('[data-ex]');if(!b)return;const i=Number(b.dataset.ex);exchangeSet.has(i)?exchangeSet.delete(i):exchangeSet.add(i);b.setAttribute('aria-pressed',String(exchangeSet.has(i)));q('.pt-confirm').disabled=!exchangeSet.size;q('.pt-confirm').textContent='Exchange '+exchangeSet.size+' tiles';};q('.pt-confirm').onclick=()=>{close();staged=[];selected=null;opponent=true;message='Exchange confirmed · demo';render();};};
 q('.pt-close').onclick=close;
 root.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>{const name=b.dataset.panel;dialog(`<h3>${name}</h3><p>${name==='Session'?'Ptown Words · English<br>ENABLE2K · enable2k/1<br>2–4 players · multiplayer only<br>Turn clock is illustrative.':name==='History'?'You · CAT · 10<br>Mara · DOT · 5'+(committed?'<br>You · ART · 3':''):'Shared session chat opens here.'}</p>`);q('.pt-close').textContent='Close';});
 render();new ResizeObserver(()=>{if(device==='landscape'&&game.clientWidth<650){device='phone';render();}layout();}).observe(game);
 if(globalThis.Tweak){const tweak=new Tweak({container:game,onChange:render});tweak.addSelect(design,'players',{label:'Player count',options:['2','4']});tweak.addSelect(design,'phoneSize',{label:'Phone size',options:['390 × 760','320 × 568']});}
})();
</script>
