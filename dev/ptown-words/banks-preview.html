<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ptown Words · local review</title>
<style>body{margin:0;background:#101a28;color:#f2eee0;font:18px system-ui;display:grid;place-content:center;min-height:100svh;padding:24px;box-sizing:border-box}main{max-width:480px}h1{font-size:28px}button,a{font:inherit;background:#7be1cc;border:0;border-radius:8px;padding:14px 20px;color:#102831;cursor:pointer;display:inline-block;margin:4px 0}small{color:#aebfcd}p{line-height:1.5}</style>
<main><small>LOCAL REVIEW · synthetic fake-money games</small><h1>Ptown Words</h1><p>Sequential opponent tiles, two +3m time banks per match, and host pause with concealed board and rack.</p><button id="bot">Play with a bot</button> <button id="humans">Open two-player preview</button><p id="status" role="status"></p><div id="links"></div><small>This preview does not change or publish production.</small></main>
<script type="module">
const post=async(op,body={},token='')=>(await fetch('/__ptown_words_route/'+op,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(body)})).json();
async function start(bot){const status=document.querySelector('#status');document.querySelectorAll('button').forEach(b=>b.disabled=true);try{status.textContent='Creating preview…';const f=await post('new',{bot}),rpc=async(name,args,who=0)=>{const r=await post('rpc',{name,args},f.tokens[who]);if(r.error)throw Error(r.error.message);return r.data;};const frame=await rpc('read_session_frame',{p_game_id:f.game}),c=await rpc('ptown_words_configure',{p_game_id:f.game,p_dealer_player_id:f.players[0],p_expected_dealer_position:2,p_game_type:'ptown-words',p_config:{ante_amount:5},p_expected_config_deadline:frame.game.config_deadline}),d=c.dealer_game.id;if(!bot)await rpc('submit_ante_decision',{p_game_id:f.game,p_expected_dealer_game_id:d,p_player_id:f.players[1],p_decision:'ante_up'},1);await rpc('advance_ante_phase',{p_game_id:f.game,p_expected_dealer_game_id:d});const url=i=>'/game/'+f.game+'?token='+f.tokens[i];if(bot){location.href=url(0);return;}document.querySelector('#links').replaceChildren(...['Host','Guest · request pause'].map((name,i)=>{const a=document.createElement('a');a.href=url(i);a.target='_blank';a.rel='noopener';a.textContent=name;return a;}));status.textContent='Open each player link in a separate browser profile or browser. Two tabs in the same profile share sign-in.';}catch(e){status.textContent=e.message;}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false);}}
document.querySelector('#bot').onclick=()=>start(true);document.querySelector('#humans').onclick=()=>start(false);
</script></html>
