  <body>
    <!-- Inline splash prevents FOUC while CSS/JS bundles load -->
    <div id="splash-screen" style="position:fixed;inset:0;z-index:99999;background:#0a0f1a;display:flex;align-items:center;justify-content:center;">
      <div style="color:#94a3b8;font-family:system-ui,sans-serif;font-size:1rem;opacity:0.8;">Loading…</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // This cover prepares artwork only. Authenticated launchSplash still owns
      // admission/playback. Keep the opening art through React's loading states.
      const cover = document.getElementById('splash-screen');
      const nav = performance.getEntriesByType('navigation')[0];
      const homeLaunch = (matchMedia('(display-mode: standalone)').matches || navigator.standalone === true)
        && location.pathname === '/' && ['', '?launch=home'].includes(location.search) && !location.hash
        && nav?.type === 'navigate' && !document.hidden && !document.wasDiscarded;
      let removed = false;
      const removeCover = () => {
        removed = true; cover?.remove(); observer.disconnect();
        window.removeEventListener('ptown:launch-cover-ready', removeCover);
      };
      if (homeLaunch && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
        const opening = new Image();
        opening.alt = ''; opening.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:contain';
        opening.onload = () => opening.decode().then(() => {
          if (removed || document.hidden) return;
          cover.style.background = '#020b15'; cover.replaceChildren(opening);
        }).catch(() => {});
        opening.src = '/launch-splash/approved-v1-opening.png';
      }
      window.addEventListener('ptown:launch-cover-ready', removeCover);
      const observer = new MutationObserver(() => {
        const root = document.getElementById('root');
        if (!homeLaunch && root && root.children.length > 0) removeCover();
      });
      observer.observe(document.getElementById('root'), { childList: true });
      // Failed initialization can never leave a blocking launch surface.
      setTimeout(removeCover, 5000);
    </script>
