name: Qualify and publish release signal

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-release-signal
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Qualify this commit (also required for documentation-only pushes)
        run: npm run validate
      - name: Verify production or record an intentional documentation-only skip
        id: release
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/deployment/release-decision.mjs

      - name: Publish the verified release signal
        if: steps.release.outputs.publish == 'true'
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_PUBLICATION_TOKEN: ${{ secrets.RELEASE_PUBLICATION_TOKEN }}
        run: |
          set -euo pipefail
          payload="$(node -e 'console.log(JSON.stringify({ buildSha: process.env.EXPECTED_SHA, deploymentId: `${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`, publishedAt: new Date().toISOString() }))')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --header "Authorization: Bearer $RELEASE_PUBLICATION_TOKEN" \
            --data "$payload" \
            https://xvhmbuppghwmwpwrkzao.supabase.co/functions/v1/publish-release
